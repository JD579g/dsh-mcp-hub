name: 🐞 Bug 反馈
description: 报告一个可复现的问题（安装、加载、工具、界面、平台差异都算）
title: '[Bug] '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        谢谢你来反馈。**带全下面这些信息，问题基本能一次定位**；
        信息不全的 issue 只能来回问，往往就拖黄了。

        提之前先看一眼 README 的「常见问题」，以及「设置 → MCP 工具 → 体检」的结果。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经重启过 DSH（插件是启动时装配的，不重启不生效）
          required: true
        - label: 我已经在「设置 → MCP 工具 → 体检」里看过环境缺什么
          required: true
        - label: 我已经搜过现有 issue，没有重复
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 实际行为 vs 期望行为。有报错就贴原文，不要只截半句。
      placeholder: |
        我在设置页点了「一键安装 mcp-xxx」，状态一直是「未连接」。
        期望：装完立刻变成「运行中」。
        页面报错：……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 设置 → MCP 工具
        2. 搜索框输入 …
        3. 点 …
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: 在「设置 → MCP 工具 → 状态条」，或插件目录的 package.json 里看
      placeholder: '1.2.0'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Android（DSHA）
        - 其他
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js 版本
      description: 终端里跑 node -v
      placeholder: v20.11.0
    validations:
      required: true

  - type: input
    id: dsh
    attributes:
      label: DSH 版本
      description: dsh --version
      placeholder: 0.1.5-rc.2

  - type: textarea
    id: doctor
    attributes:
      label: 体检结果
      description: |
        「设置 → MCP 工具 → 体检」的报告贴进来；或者跑 /mcp doctor。
      render: text
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        - 宿主日志：~/.dsh/mcp-hub/hub.log
          （Windows 是 %USERPROFILE%/.dsh/mcp-hub/hub.log）
        - DSH 启动日志里带 [dsh-mcp-hub] 的行
        只贴相关片段即可，注意别把密钥贴进来。
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、自定义的 servers.json 片段、涉及的服务名与命令等
    validations:
      required: false
