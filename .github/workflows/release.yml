name: Release

# 打 tag 才发版：tag 必须等于 package.json 的版本（生态里的硬校验）。
#
# 顺序很重要：测试与打包用 runner 自带的 npm；**不要**在测试前全局升级 npm，
# 否则 install.ps1 里那句 npm pack 会随 npm 大版本改变行为而失败（真踩过）。
# 需要新 npm 的地方（Trusted Publishing 要求 >= 11.5）放到最后，用 npx 临时取。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write     # 创建/更新 GitHub Release
  id-token: write     # npm Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: 校验 tag 与 package.json 版本一致
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${{ github.ref_name }}
          TAG=${TAG#v}
          echo "package.json=$PKG  tag=$TAG"
          [ "$PKG" = "$TAG" ] || { echo "::error::tag 与 package.json 版本不一致，先改好再发"; exit 1; }

      - name: 安装测试依赖
        run: npm ci --no-audit --no-fund

      - name: 全量测试
        env:
          MCP_HUB_REQUIRE_SDK: '1'
        run: npm test

      - name: 发布包自检
        run: npm run pack:check

      - name: 打包并挂到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          TARBALL=$(ls dsh-mcp-hub-*.tgz | head -1)
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "$TARBALL" --clobber
          else
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file CHANGELOG.md "$TARBALL"
          fi

      # 在 npmjs.com 上配好 Trusted Publisher（仓库 + 本 workflow）之后，
      # 把仓库变量 NPM_PUBLISH_ENABLED 设为 true 即会自动发布；
      # 没配之前这一步直接跳过，保证 Release 始终是绿的。
      - name: npm publish（OIDC，带 provenance）
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        run: npx --yes npm@11 publish --access public --provenance
