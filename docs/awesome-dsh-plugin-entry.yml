url: https://github.com/JD579g/dsh-mcp-hub
name: JD579g/dsh-mcp-hub
category: tools
description:
  en: >-
    One-click MCP deployment for DSH: browse a curated catalog or search the official MCP
    Registry, npm and GitHub on demand, then install a server without restarting the harness.
    Ships an environment doctor, per-server call permissions (always / session / ask /
    disabled), a built-in PowerShell-or-cmd terminal, and 7 zero-dependency built-in MCP
    servers (61 tools) that also run as plain stdio servers in any MCP host. Windows-first:
    PATHEXT-aware command resolution, platform-aware overlap warnings against DSH's own tools.
  zh: >-
    给 DSH 的 MCP 一键部署台：内置可装目录，也能按需搜索官方 MCP Registry、npm 与 GitHub，
    装完立即挂载不用重启。自带环境体检、按服务设置的调用权限（永久 / 本会话 / 询问 / 禁用）、
    内置 PowerShell 或 cmd 终端，以及 7 个零依赖内置 MCP 服务（61 个工具，同样可被任何 MCP
    宿主直接启动）。Windows 优先：按 PATHEXT 解析命令，搜索时按平台提示与 DSH 原生工具的重叠。
